name = "buddymon-gold"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# Static files: index.html, app.js, the emulator and the built ROMs.
[assets]
directory = "./public"
binding = "ASSETS"
# Let the Worker see every request so it can serve /api/*. Assets are still
# served by env.ASSETS.
run_worker_first = true

# Battery saves (the 32 KB cartridge RAM), one entry per player per game.
# Create the namespace with:  npx wrangler kv namespace create SAVES
# and paste the returned id below.
[[kv_namespaces]]
binding = "SAVES"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
