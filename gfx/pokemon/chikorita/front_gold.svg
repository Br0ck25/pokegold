<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" data-palette="#ffffff #f0c070 #3aa63a #000000">
  <g stroke="#000" stroke-width="1" stroke-linejoin="round" shape-rendering="crispEdges">
    <!-- leaf spines: a spiky crest swept back behind the head -->
    <path fill="#3aa63a" d="M4 27 L2 19 L7 20 L6 11 L11 14 L13 5 L17 11 L20 3 L23 11 L27 5 L29 14 L34 11 L33 20 L38 19 L36 27 L30 31 L10 31 Z"/>
    <!-- feet -->
    <ellipse fill="#f0c070" cx="12" cy="36" rx="5" ry="2.8"/>
    <ellipse fill="#f0c070" cx="28" cy="36" rx="5" ry="2.8"/>
    <!-- body -->
    <ellipse fill="#f0c070" cx="20" cy="30" rx="10" ry="7"/>
    <!-- ears -->
    <circle fill="#f0c070" cx="11" cy="16" r="3.5"/>
    <circle fill="#f0c070" cx="29" cy="16" r="3.5"/>
    <!-- head -->
    <ellipse fill="#f0c070" cx="20" cy="22" rx="10" ry="8"/>
  </g>
  <g shape-rendering="crispEdges">
    <!-- eyes -->
    <ellipse fill="#000" cx="15.5" cy="21" rx="2" ry="2.5"/>
    <ellipse fill="#000" cx="24.5" cy="21" rx="2" ry="2.5"/>
    <rect fill="#fff" x="15" y="19.5" width="1.5" height="1.5"/>
    <rect fill="#fff" x="24" y="19.5" width="1.5" height="1.5"/>
    <!-- snout -->
    <ellipse fill="#fff" cx="20" cy="26" rx="3.5" ry="2"/>
    <rect fill="#000" x="19" y="24.3" width="2" height="1.5"/>
    <!-- belly patch -->
    <rect fill="#fff" x="17" y="31" width="6" height="3"/>
  </g>
</svg>
